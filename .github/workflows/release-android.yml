name: Release Android

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @altersend/core build && pnpm --filter @altersend/domain build && pnpm --filter @altersend/components build

      - name: Generate Android project
        run: pnpm exec expo prebuild --clean --platform android --no-install
        working-directory: apps/mobile

      - name: Bundle Bare worklet for Android
        run: pnpm --filter @altersend/mobile bundle:android

      - name: Build Android APK
        run: ./gradlew assembleRelease
        working-directory: apps/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  release:
    needs: build-android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read mobile version
        id: version
        run: echo "value=$(node -p "require('./apps/mobile/app.json').expo.version")" >> $GITHUB_OUTPUT

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/*.apk)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Android APK artifacts found"
            exit 1
          fi
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --draft --title "$tag"
          fi
