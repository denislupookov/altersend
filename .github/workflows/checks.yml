name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Check design tokens
        run: pnpm run check:tokens

      - name: Knip (unused files / deps / exports)
        run: pnpm run knip

      - name: Build packages
        run: pnpm run build

      - name: Type-check
        run: |
          pnpm --filter @altersend/core typecheck
          pnpm --filter @altersend/domain typecheck
          pnpm --filter @altersend/components typecheck
          pnpm --filter @altersend/desktop typecheck
          pnpm --filter @altersend/mobile typecheck

      - name: Test
        run: pnpm test
