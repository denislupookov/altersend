name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13

      - name: Enable pnpm
        shell: bash
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          shim_dir="$RUNNER_TEMP/corepack-shims"
          mkdir -p "$shim_dir"
          npm exec --yes corepack@0.34.7 -- prepare "$package_manager" --activate
          npm exec --yes corepack@0.34.7 -- enable pnpm --install-directory "$shim_dir"
          echo "$shim_dir" >> "$GITHUB_PATH"
          "$shim_dir/pnpm" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Check design tokens
        run: pnpm run check:tokens

      - name: Knip (unused files / deps / exports)
        run: pnpm run knip

      - name: Build packages
        run: pnpm run build

      - name: Type-check
        run: |
          pnpm --filter @altersend/core typecheck
          pnpm --filter @altersend/domain typecheck
          pnpm --filter @altersend/components typecheck
          pnpm --filter @altersend/desktop typecheck
          pnpm --filter @altersend/mobile typecheck

      - name: Test
        run: pnpm test
