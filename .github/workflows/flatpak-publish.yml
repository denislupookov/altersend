name: Flatpak Publish

on:
  push:
    # TODO: revert before upstream PR
    # branches:
    #   - main
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak-publish.yml'
  workflow_dispatch:

concurrency:
  group: "flatpak-publish"
  cancel-in-progress: true

jobs:
  build-flatpak:
    # Guard against accidental workflow_dispatch runs from non-main branches.
    # The push trigger above already restricts to main, but workflow_dispatch
    # can be triggered manually from any branch via the GitHub UI.
    # TODO: revert before upstream PR
    # if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions@sha256:d534700a8a0090dfa5e23ed3ae09106a1beafde54e66b6b1327b27dbd3f0c7c2 # freedesktop-24.08
      options: --privileged
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout existing OSTree repo for delta updates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # TODO: revert before upstream PR
          repository: riftrogue/altersend-flatpak
          ref: main
          path: repo
          token: ${{ secrets.FLATPAK_PUBLISH_TOKEN }}

      - name: Clean and verify OSTree repo
        run: |
          if [ -f repo/config ]; then
            echo "Validating existing OSTree repository..."
            # Git drops empty directories, but OSTree needs them to exist
            mkdir -p repo/refs/remotes repo/refs/mirrors repo/objects
            ostree fsck --repo=repo
            rm -rf repo/.git
          else
            echo "Repository exists but is not an OSTree repository (yet). Cleaning up so flatpak-builder can initialize it."
            rm -rf repo
          fi

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          bundle: altersend.flatpak
          manifest-path: flatpak/com.altersend.AlterSend.yaml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/com.altersend.AlterSend.yaml', 'flatpak/node-modules.json') }}
          # build-bundle produces a standalone .flatpak file for the GitHub Actions
          # artifact. Not needed for the repo-based install path; set to false to
          # skip the slow compression step and save ~2-3 minutes of CI time.
          build-bundle: false
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@111c56156bcc6918c056dbef52164cfa583dc549 # v6
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          # Uncomment and add secret if your key has a passphrase:
          # passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}

      - name: Sign OSTree Repository & Generate .flatpakrepo
        # Use an env var for the fingerprint instead of direct template injection
        # into the shell script, following GitHub's security hardening guidelines.
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          # Sign the repo and generate static delta updates
          flatpak build-update-repo --generate-static-deltas --gpg-sign="$GPG_FINGERPRINT" repo

          # Export public key to repo for manual downloading
          gpg --armor --export "$GPG_FINGERPRINT" > repo/altersend.gpg

          # Convert GPG key to base64 without newlines for the .flatpakrepo file
          GPG_B64=$(gpg --export "$GPG_FINGERPRINT" | base64 | tr -d '\n')

          # Generate altersend.flatpakrepo — heredoc must be at column 0 so that
          # no leading whitespace is written into the INI-format file.
          cat > repo/altersend.flatpakrepo <<EOF
[Flatpak Repo]
Title=AlterSend
# TODO: revert before upstream PR
Url=https://riftrogue.github.io/altersend-flatpak/
Homepage=https://altersend.com/
Comment=AlterSend Official Flatpak Repository
Description=Peer-to-peer file transfer
Icon=https://raw.githubusercontent.com/denislupookov/altersend/main/assets/01-logo-icon-logo-icon-512x512.png
GPGKey=${GPG_B64}
EOF

      - name: Deploy to Flatpak Repo (GitHub Pages)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.FLATPAK_PUBLISH_TOKEN }}
          # TODO: revert before upstream PR
          external_repository: riftrogue/altersend-flatpak
          publish_branch: main
          publish_dir: repo
          keep_files: true
          force_orphan: false
          commit_message: "deploy: update from ${{ github.repository }}@${{ github.sha }}"
